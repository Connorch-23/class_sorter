[project]
name = "class-sorter"
version = "0.1.0"
description = "Campers to classes assignment system"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas>=2.0.0",
    "pytest>=9.1.1",
]

[project.scripts]
class-sorter = "class_sorter.main:main"

[build-system]
requires = ["uv-build>=0.13.0,<0.14.0"]
build-backend = "uv_build"